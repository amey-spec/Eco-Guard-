name: CI

# EcoGuard build & security verification pipeline.
#
# Jobs
#   client   - npm ci + production build + lint
#   server   - npm ci + syntax check + node:test suite (API smoke tests and
#              production startup-guard tests, all against throwaway DBs)
#   security - dependency vulnerability policy gate (scripts/dependency-audit.js)
#   e2e      - seeds a throwaway DB, boots the real API on :5000, then runs the
#              Playwright E2E suite (Vite dev server is started by Playwright)
#
# The pipeline fails when the frontend build fails, backend verification fails,
# the dependency vulnerability threshold is exceeded, or required tests fail.
# No secrets are committed: CI runs in development mode by default, the E2E job
# generates an ephemeral JWT secret at runtime, and the production startup
# guards are verified with runtime-generated secrets only.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        working-directory: client
        run: npm ci

      - name: Production build
        working-directory: client
        run: npm run build

      - name: Lint
        working-directory: client
        run: npm run lint

  server:
    name: Server verification + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        working-directory: server
        run: npm ci

      - name: Syntax check
        working-directory: server
        run: |
          for f in index.js config/*.js routes/*.js scripts/*.js; do
            node --check "$f"
          done
          echo "Syntax OK"

      - name: Run backend test suite (node:test)
        working-directory: server
        run: npm test

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run dependency policy audit (client + server)
        run: npm run audit:deps

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies (npm ci)
        working-directory: client
        run: npm ci

      - name: Install server dependencies (npm ci)
        working-directory: server
        run: npm ci

      # GitHub-hosted runners ship Google Chrome at /usr/bin/google-chrome; if
      # no system browser is present, install Playwright's own Chromium and
      # point PLAYWRIGHT_CHROME_EXECUTABLE at it (see playwright.config.js).
      - name: Locate or install a browser for Playwright
        working-directory: client
        run: |
          set -euo pipefail
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then
              echo "PLAYWRIGHT_CHROME_EXECUTABLE=$c" >> "$GITHUB_ENV"
              echo "Using system browser: $c"
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
          BIN="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name headless_shell \) 2>/dev/null | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "No browser binary found after install" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROME_EXECUTABLE=$BIN" >> "$GITHUB_ENV"
          echo "Using Playwright Chromium: $BIN"

      - name: Seed a fresh throwaway database
        working-directory: server
        run: npm run seed

      - name: Start the API on :5000 (ephemeral JWT secret)
        working-directory: server
        run: |
          JWT_SECRET="$(openssl rand -hex 32)" PORT=5000 nohup node index.js > /tmp/ecoguard-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "API failed to become ready" >&2
          cat /tmp/ecoguard-api.log >&2
          exit 1

      - name: Run Playwright E2E suite
        working-directory: client
        run: npm run test:e2e
